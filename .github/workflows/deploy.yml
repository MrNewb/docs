name: Deploy docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install
        env:
          BUN_FEATURE_FLAG_DISABLE_STREAMING_INSTALL: '1'
          BUN_CONFIG_HTTP_RETRY_COUNT: '10'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --frozen-lockfile --network-concurrency 8; then
              exit 0
            fi
            echo "bun install failed (attempt ${attempt}), retrying..."
            rm -rf node_modules
            sleep $((attempt * 2))
          done
          exit 1

      - name: Build
        run: bun run build

      - name: Ensure .nojekyll
        run: test -f out/.nojekyll || touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
